name: tests

# 離線單元測試（無 token/網路需求）：日期閘門、聚合純函式、fmclient 重試、
# lending 瘦身欄位形狀。只在 Python/測試相關檔變動時觸發，bot 資料 commit 不會跑。
on:
  push:
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -q
      # ⚠ 本檔 concurrency 為 cancel-in-progress: true：同一 ref 連續 push 時，
      # 前一輪 run 會被 GitHub 取消（正常行為），會觸發本告警。
      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: postmkt-test
