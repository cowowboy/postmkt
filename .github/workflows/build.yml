name: build postmkt data

on:
  schedule:
    # 平日 21:53 台北（13:53 UTC）：FinMind TaiwanStockDayTrading 的量值約 21:30 後
    # 才更新，21:30 起跑會抓到空 Volume 而回退到前一日；延後留緩衝，並取冷門分鐘
    # 避開 GitHub cron 整點/半點壅塞（2026-07-14 依審計調整，原 21:30）
    #（雙觸發機制：taiwan-flow-live-v2 的 Cloudflare Worker「FinMind 哨兵」會在台北
    # 19:00-23:00 每 5 分探測融資券/當沖量值落地，一落地即 workflow_dispatch 本
    # workflow，通常比這條 cron 早跑；cron 保留當備援，管線冪等、多跑無害。
    # 哨兵程式：taiwan-flow-live-v2/worker/src/index.js 的 runSentinel）
    - cron: "53 13 * * 1-5"
  workflow_dispatch:   # 手動觸發＋FinMind 哨兵自動觸發

permissions:
  contents: write
  issues: write   # 失敗通知開 issue 用

concurrency:
  group: build-postmkt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build postmkt.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python build_postmkt.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/postmkt.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: postmkt $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 4
          done
          if [ "$pushed" != "1" ]; then echo "::error::push failed after 5 retries"; exit 1; fi

      # 失敗告警：同日同管線只開一張 issue，重複失敗改留言（避免 issue 洪水）
      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="pipeline 失敗：postmkt $(TZ=Asia/Taipei date +%F)"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "再次失敗：$RUN_URL"
          else
            gh issue create --title "$title" --body "失敗 run：$RUN_URL"
          fi
