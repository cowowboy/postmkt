name: build postmkt data

on:
  schedule:
    # 平日 21:53 台北（13:53 UTC）：FinMind TaiwanStockDayTrading 的量值約 21:30 後
    # 才更新，21:30 起跑會抓到空 Volume 而回退到前一日；延後留緩衝，並取冷門分鐘
    # 避開 GitHub cron 整點/半點壅塞（2026-07-14 依審計調整，原 21:30）
    #（雙觸發機制：taiwan-flow-live-v2 的 Cloudflare Worker「FinMind 哨兵」會在台北
    # 19:00-23:00 每 5 分探測融資券/當沖量值落地，一落地即 workflow_dispatch 本
    # workflow，通常比這條 cron 早跑；cron 保留當備援，管線冪等、多跑無害。
    # 哨兵程式：taiwan-flow-live-v2/worker/src/index.js 的 runSentinel）
    - cron: "53 13 * * 1-5"
  workflow_dispatch:   # 手動觸發＋FinMind 哨兵自動觸發

permissions:
  contents: write
  issues: write   # 失敗通知開 issue 用

concurrency:
  group: build-postmkt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build postmkt.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python build_postmkt.py

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/postmkt.json
          message: "data: postmkt"

      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: postmkt
