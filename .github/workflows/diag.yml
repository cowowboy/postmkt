name: build diag data

on:
  schedule:
    # 平日 22:10 台北（14:10 UTC）：排在 build.yml 21:53 之後，
    # 讓 data/postmkt.json（券資比/當沖量 merge 來源）先落地
    - cron: "40 14 * * 1-5"   # 22:40 台北（備援；主觸發＝v2 Worker 晚場協調班鏈式 dispatch：postmkt.json 今日已備即發，2026-07-22）
  workflow_dispatch:   # 手動觸發
  push:
    branches: [main]   # 只限 main：feature 分支觸發會在 push 階段失敗且無意義（run #2 教訓）
    paths:
      - src/build_diag.py
      - .github/workflows/diag.yml

permissions:
  contents: write
  issues: write   # 失敗通知開 issue 用

concurrency:
  group: build-diag
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      # cache.json（~3MB 增量快取）2026-07-24 起改走 actions/cache、不再 commit 進 git
      # （每晚一個 blob 是 repo 膨脹最大源）。restore-keys 前綴比對＝拿最近一次的快取；
      # 快取被 GitHub 淘汰（7 天未用/總量滿）時 build_diag.py 會自動全量重建，只是該晚 API 呼叫較多
      - name: Restore diag cache
        uses: actions/cache/restore@v4
        with:
          path: data/diag/cache.json
          key: diag-cache-${{ github.run_id }}
          restore-keys: |
            diag-cache-

      - name: Build diag.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python src/build_diag.py

      - name: Save diag cache
        uses: actions/cache/save@v4
        with:
          path: data/diag/cache.json
          key: diag-cache-${{ github.run_id }}

      - name: Commit and push
        uses: ./.github/actions/commit-data
        with:
          paths: data/diag
          message: "data: diag"

      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: diag
